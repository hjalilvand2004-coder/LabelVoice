[theme]
base = "light"
# پالت داروخانه‌ای v2.1.0 — آبی اعتماد #1E88E5 + سبز سلامت #43A047
primaryColor = "#1e88e5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f9fe"
textColor = "#12283d"
font = "sans serif"

[server]
enableXsrfProtection = true
maxUploadSize = 10
# حریم خصوصی: سرویس فقط روی localhost ارائه شود (در صورت نیاز تغییر دهید)
address = "127.0.0.1"

[browser]
gatherUsageStats = false
